<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Officer viewer</title>
<!-- Dev tool: every officer (or ?ids=a,b; &hero = the fine battle-hero model, &zoom=2) on its own rig, front and back, idle and mid-attack, no battle — for checking
     models (e.g. the Higgsfield voxel bodies) quickly. Serve the repo root and open /suquan/tools/viewer.html. -->
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three/three.module.js",
    "engine/": "../../src/",
    "../../src/chars/index.js": "../src/chars/index.js",
    "../../src/chars/npc/index.js": "../src/chars/npc/index.js",
    "../../src/crowd/armies.js": "../src/crowd/armies.js",
    "../../src/world/maps/index.js": "../src/world/maps/index.js",
    "../../src/story/chapters.js": "../src/story/chapters.js",
    "../../src/story/trials.js": "../src/story/trials.js",
    "../../src/core/progress.js": "../src/core/progress.js",
    "../../src/core/difficulty.js": "../src/core/difficulty.js"
} }
</script>
<style>html, body { margin: 0; height: 100%; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { CHARS, CHAR_ORDER } from '../../src/chars/index.js';
import { NPCS } from '../../src/chars/npc/index.js';
import { createRig, sampleClip, POSE_SIZE, HERO_SCALE } from '../../src/hero/rig.js';
import { loadMap } from '../../src/world/map.js';
import { MAPS } from '../../src/world/maps/index.js';
import { loadFine } from '../src/chars/voxbody.js';

loadMap(MAPS.hoalu);
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || CHAR_ORDER.join(',')).split(',');
const clipB = q.get('clip') || 'n3', tB = +(q.get('t') || 0.45);
if (q.has('hero')) await Promise.all(ids.map(loadFine));
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6a6e74);
scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x6a5a4a, 2.2));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.6); sun.position.set(2, 4, 5); scene.add(sun);
const back = new THREE.DirectionalLight(0xc0d0ff, 1.2); back.position.set(-3, 3, -5); scene.add(back);
const pose = new Float32Array(POSE_SIZE), gap = 1.6;
ids.forEach((id, i) => {
  const ch = CHARS[id] || NPCS[id];
  if (!ch) return;
  const K = ch.kit;
  [[0, 'idle', 0.3], [Math.PI, 'idle', 0.3], [0, clipB, tB]].forEach(([yaw, clip, t], r) => {
    const rig = createRig(K), m = K.model(rig, q.has('hero') ? { hero: true } : undefined);
    scene.add(rig.root);
    sampleClip(K.clips[clip] || K.clips.idle, t, pose);
    rig.apply(pose, new THREE.Vector3(((i * 3 + r) - (ids.length * 3 - 1) / 2) * gap, 0, 0), yaw, 0);
    rig.root.scale.setScalar(K.scale || HERO_SCALE); rig.root.updateMatrixWorld(true);
  });
});
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
const w = ids.length * 3 * gap;
const zoom = +(q.get('zoom') || 1);
cam.position.set(0, 1.3, (w * 1.75 + 2) / zoom); cam.lookAt(0, 0.95 + (zoom > 1 ? 0.5 : 0), 0);
renderer.render(scene, cam);
window.__done = true;
</script>
</body>
</html>
